name: Automated Preprocessing

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run preprocessing script
      run: |
        python "Kriteria 1/preprocessing/automate_Ghina.py"

    - name: Commit processed dataset
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        # Cek apakah ada file baru/terubah di folder
        if [ -n "$(git status --porcelain "Kriteria 1/preprocessing/dataset_preprocessing")" ]; then
          git add "Kriteria 1/preprocessing/dataset_preprocessing"
          git commit -m "Update processed dataset"
          git push
        else
          echo "No files to commit"
        fi
